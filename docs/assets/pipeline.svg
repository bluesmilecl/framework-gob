<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
<title id="title">Cómo se construye</title>
<desc id="desc">El CSS oficial de gob.cl se parte por módulo SCSS, se convierte en tokens y capas de Tailwind, se compila a dist/gob.css y se compara contra la documentación oficial: 99,52 % de paridad.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0d2350"/></linearGradient></defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'DejaVu Sans',sans-serif}
  .h{font-size:30px;font-weight:800;fill:#ffffff}
  .s{font-size:17px;fill:#a8b7c7}
  .nt{font-size:19px;font-weight:700;fill:#ffffff}
  .ns{font-size:14px;fill:#a8b7c7}
  .tag{font-size:13.5px;fill:#bfdcf5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
  .dash{stroke:#5b6b8c;stroke-width:2.2;stroke-dasharray:7 7;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1280" height="470" rx="16" fill="url(#bg)"/>
<rect x="48" y="34" width="48.0" height="4" fill="#006fb3"/><rect x="96.0" y="34" width="48.0" height="4" fill="#fe6565"/>
<text x="48" y="80" class="h">Cómo se construye</text>
<text x="48" y="110" class="s">El core no se reescribió a mano: se genera desde el CSS oficial y se verifica contra él.</text>
