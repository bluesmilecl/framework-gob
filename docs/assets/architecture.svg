<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="656" viewBox="0 0 1280 656" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura de framework-gob</title>
<desc id="desc">Tu app (HTML sin build, Vite con Tailwind 4 o React 19) sobre el núcleo gob-cl-tailwind (tokens, reboot, componentes Bootstrap 4 y gob.cl, alto contraste, 427 íconos, JS sin jQuery), las capas opcionales y la base: Tailwind CSS 4, Roboto, Lucide y Simple Icons.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0d2350"/></linearGradient></defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'DejaVu Sans',sans-serif}
  .lb{font-size:14px;font-weight:800;letter-spacing:2.5px}
  .bt{font-size:16px;font-weight:700;fill:#ffffff}
  .bs{font-size:12.5px;fill:#a9b6c8;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
  .dash{stroke:#5b6b8c;stroke-width:2;stroke-dasharray:4 5;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-18}}
  .pop{animation:pop .6s cubic-bezier(.2,.8,.2,1) backwards}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
